[workspace]
members = [
    "crates/reqflux",
    "crates/reqflux_core",
    "crates/reqflux_engine",
    "crates/reqflux_http",
    "crates/reqflux_mcp",
    "crates/reqflux_postman",
    "crates/reqflux_script",
    "crates/reqflux_store",
    "crates/reqflux_ui",
]
default-members = ["crates/reqflux"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0-dev.0"
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "A local-first HTTP client"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
reqflux_core = { path = "crates/reqflux_core" }
reqflux_engine = { path = "crates/reqflux_engine" }
reqflux_http = { path = "crates/reqflux_http" }
reqflux_mcp = { path = "crates/reqflux_mcp" }
reqflux_postman = { path = "crates/reqflux_postman" }
reqflux_script = { path = "crates/reqflux_script" }
reqflux_store = { path = "crates/reqflux_store" }
reqflux_ui = { path = "crates/reqflux_ui" }

anyhow = "1.0.104"
base64 = "0.23.1"
# Local dates in the UI; it reads the system time zone safely in a multithreaded process.
chrono = { version = "0.4" }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate", "zstd", "form", "multipart", "stream"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
wiremock = "0.6.5"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26"
env_logger = "0.11.11"
# The `v1` feature picks the platform store: Secret Service over zbus (pure Rust) on
# Linux and the BSDs, Keychain on macOS, Credential Manager on Windows.
keyring = "4.2.0"
log = "0.4.34"
pretty_assertions = "1.4.1"
rand = "0.10.3"
rpassword = "7.5.4"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
# Format-preserving edits of the user's config file: comments, order and unknown keys survive.
toml_edit = "0.25.17"
ulid = { version = "3.0.0", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }

# Dependencies track their latest release, except the GPUI stack: ReqFlux
# follows DBFlux's GPUI stack (gpui-pre, gpui-component, gpui-pre-platform,
# gpui-kit-assets and the gpui-mcp bridge) at the versions DBFlux pins, and takes
# DBFlux's patched copies by git rev (see [patch.crates-io]). Move them together
# with DBFlux.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.7.3" }
# Decodes image responses for Preview; the version gpui-pre already depends on.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The Lucide icon catalog gpui-component 0.7.3 bundles, the one DBFlux links; ReqFlux's
# screens draw its icons through `bolt`'s `IconSource::Svg`.
gpui-kit-assets = { version = "=0.7.3" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "wayland", "x11"] }

# UI automation bridge, installed in every window so agents can drive the app
# through `reqflux mcp`; `reqflux_mcp` speaks `gpui-mcp-protocol` to it. Both are
# DBFlux's vendored copies of upstream gpui-mcp, built against the same patched
# gpui-pre, from DBFlux's main at the rev that merged Bolt (#1233).
gpui-mcp = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af", default-features = false, features = ["gpui-pre"] }
gpui-mcp-protocol = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }

# Bolt, the design system shared with DBFlux, from the same DBFlux rev as the GPUI stack.
# ReqFlux installs it with its own brand.
bolt = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"

# ReqFlux follows DBFlux's GPUI stack by git rev: DBFlux vendors gpui-pre 0.3.9
# with the frame-observer hooks the bridge needs, gpui-base and gpui-component
# 0.7.3 with its editor patches, and gpui-pre-linux 0.3.9 with a Wayland keymap
# fix (see vendor/*/VENDOR.md there). Taking them by git keeps the app, bolt,
# gpui-component and the bridge on one GPUI build without copying them here.
# The rev is DBFlux's main where Bolt was merged (#1233); move it with DBFlux.
[patch.crates-io]
gpui-pre = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }
gpui-base = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }
gpui-component = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }
gpui-pre-linux = { git = "https://github.com/0xErwin1/dbflux", rev = "33c835a9b50e2e90bdd0dbfe7f020817079a40af" }

# Line tables keep backtraces usable at a fraction of the link time and
# memory that full debug info costs with GPUI in the graph.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
