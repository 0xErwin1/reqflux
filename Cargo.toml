[workspace]
members = [
    "crates/bolt",
    "crates/reqflux",
    "crates/reqflux_core",
    "crates/reqflux_engine",
    "crates/reqflux_http",
    "crates/reqflux_mcp",
    "crates/reqflux_postman",
    "crates/reqflux_script",
    "crates/reqflux_store",
    "crates/reqflux_ui",
]
default-members = ["crates/reqflux"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0-dev.0"
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "A local-first HTTP client"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bolt = { path = "crates/bolt" }
reqflux_core = { path = "crates/reqflux_core" }
reqflux_engine = { path = "crates/reqflux_engine" }
reqflux_http = { path = "crates/reqflux_http" }
reqflux_mcp = { path = "crates/reqflux_mcp" }
reqflux_postman = { path = "crates/reqflux_postman" }
reqflux_script = { path = "crates/reqflux_script" }
reqflux_store = { path = "crates/reqflux_store" }
reqflux_ui = { path = "crates/reqflux_ui" }

anyhow = "1.0.104"
base64 = "0.23.1"
# Local dates in the UI; it reads the system time zone safely in a multithreaded process.
chrono = { version = "0.4" }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate", "zstd", "form", "multipart", "stream"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
wiremock = "0.6.5"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26"
env_logger = "0.11.11"
# The `v1` feature picks the platform store: Secret Service over zbus (pure Rust) on
# Linux and the BSDs, Keychain on macOS, Credential Manager on Windows.
keyring = "4.2.0"
log = "0.4.34"
pretty_assertions = "1.4.1"
rand = "0.10.3"
rpassword = "7.5.4"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
# Format-preserving edits of the user's config file: comments, order and unknown keys survive.
toml_edit = "0.25.17"
ulid = { version = "3.0.0", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }

# Dependencies track their latest release, except the GPUI stack: it follows
# the newest gpui-pre the UI automation bridge (gpui-mcp) supports, 0.3.7,
# which gpui-component 0.7.0 and gpui-pre-platform 0.3.7 pin. Move all three when
# gpui-mcp supports a newer gpui-pre (tracked upstream in gpui-mcp#15).
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = { version = "=0.7.0" }
# Decodes image responses for Preview; the version gpui-pre already depends on.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The Lucide icon catalog gpui-component 0.7.0 bundles; 0.7.1 and later need a newer gpui-pre.
gpui-kit-assets = { version = "=0.7.0" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.7", default-features = false, features = ["font-kit", "wayland", "x11"] }

# UI automation bridge, installed in every window so agents can drive the app
# through `reqflux mcp`. The protocol crate is what `reqflux_mcp` will speak to it.
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "eb248ccf43847797b9067c47eeef1dd188dc03a6", default-features = false, features = ["gpui-pre"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"

# The bridge needs observation and input hooks that upstream GPUI does not
# have yet. gpui-mcp publishes gpui-pre 0.3.7 with them applied; this keeps
# the app, gpui-component and the bridge on that one GPUI build. Drop it when
# gpui-pre ships the hooks.
[patch.crates-io]
gpui-pre = { git = "https://github.com/themixednuts/gpui-mcp", rev = "eb248ccf43847797b9067c47eeef1dd188dc03a6" }

# Line tables keep backtraces usable at a fraction of the link time and
# memory that full debug info costs with GPUI in the graph.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
