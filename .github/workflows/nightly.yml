name: Nightly

# Rolling nightly build of the Linux `reqflux` package, like DBFlux's: one
# prerelease under the single tag `nightly`, replaced by every new build. It
# runs once a day and skips when main has not advanced since the commit the
# `nightly` tag points at, so the tag count never grows and an idle main
# publishes nothing. A manual dispatch always builds.

on:
  schedule:
    # 03:17 UTC daily: a low-traffic window, off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard - canonical repo and new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to build
        id: guard
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          # Only the canonical repository runs the schedule; forks do not.
          if [ "$REPOSITORY" != "0xErwin1/reqflux" ]; then
            echo "Skipping nightly: not the canonical repository."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run always builds, even with no new commits.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: building regardless of new commits."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The `nightly` tag points at the main commit the last nightly was
          # built from. Skip when main has not advanced since then.
          CURRENT="$(git rev-parse HEAD)"
          if ! LAST="$(git rev-parse --verify --quiet 'nightly^{commit}')"; then
            echo "No previous nightly tag: building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LAST" = "$CURRENT" ]; then
            echo "No new commits on main since the last nightly ($LAST): skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prose and designs do not reach the binary, so a range made only of
          # them would publish the same build again. The tag stays put, so the
          # next nightly's changes still cover those commits. A failed diff
          # builds: a broken check costs a build rather than a missed nightly.
          if ! changed="$(git diff --name-only "$LAST" "$CURRENT")"; then
            echo "::warning::cannot diff $LAST..$CURRENT; building"
          elif ! printf '%s\n' "$changed" | grep -qvE '(\.md$|^design/)'; then
            echo "main advanced $LAST -> $CURRENT with prose and design changes only: skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "main advanced $LAST -> $CURRENT: building."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  compute-version:
    name: Compute nightly version
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.nightly.outputs.version }}
      short_sha: ${{ steps.nightly.outputs.short_sha }}
      date: ${{ steps.nightly.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute version string
        id: nightly
        run: |
          # The nightly version is the workspace version with its pre-release
          # suffix stripped (0.1.0-dev.0 -> 0.1.0) plus the short commit as
          # semver build metadata, which does not affect semver ordering.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 workspace version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          BASE=$(grep '^version = "' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/' | sed 's/-[^+]*//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE}-nightly+${SHORT_SHA}"
          {
            echo "version=${NIGHTLY_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "date=$(date -u '+%Y-%m-%d')"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${NIGHTLY_VERSION}"

  build:
    name: Build Linux
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfreetype-dev \
            libfontconfig-dev libssl-dev libzstd-dev libasound2-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The scheduled run is on main; a cache saved on a tag ref can never
          # be read back (same rationale as DBFlux's build).
          save-if: github.ref == 'refs/heads/main'

      - name: Stamp workspace version
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # Same single-line guard as compute-version. VERSION is read from
          # env, not interpolated into the script, so crafted input cannot
          # inject shell. No --locked on the build below: the stamp mutates
          # Cargo.toml, so cargo must refresh the workspace entry in
          # Cargo.lock; dependency-lock integrity is enforced by CI (--locked)
          # on the same commit, where only the local workspace version differs.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 workspace version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          sed -i "s|^version = \".*\"|version = \"${VERSION}\"|" Cargo.toml
          grep -qF "version = \"${VERSION}\"" Cargo.toml \
            || { echo "::error::Version stamp did not apply."; exit 1; }

      - name: Build ReqFlux
        run: cargo build --release -p reqflux

      - name: Assemble the package
        run: |
          mkdir -p pkg/bin pkg/share/applications
          mkdir -p pkg/share/icons/hicolor/scalable/apps
          mkdir -p pkg/share/icons/hicolor/256x256/apps
          cp target/release/reqflux pkg/bin/reqflux
          cp assets/icon/reqflux.desktop pkg/share/applications/reqflux.desktop
          cp assets/icon/reqflux.svg pkg/share/icons/hicolor/scalable/apps/reqflux.svg
          cp assets/icon/reqflux-256.png pkg/share/icons/hicolor/256x256/apps/reqflux.png
          cp LICENSE-APACHE pkg/LICENSE-APACHE

      - name: Create tar archive
        run: |
          cd pkg
          tar -czf ../reqflux-linux-amd64.tar.gz .

      - name: Generate checksum
        run: sha256sum reqflux-linux-amd64.tar.gz > reqflux-linux-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            reqflux-linux-amd64.tar.gz
            reqflux-linux-amd64.tar.gz.sha256
          retention-days: 90

  release:
    name: Publish rolling nightly release
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The previous `nightly` tag scopes the list of changes.
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts

      - name: Compose nightly release body
        env:
          SHORT_SHA: ${{ needs.compute-version.outputs.short_sha }}
          DATE: ${{ needs.compute-version.outputs.date }}
        run: |
          cat > release_body.md <<EOF
          > **Nightly build**: built automatically from \`main\` once a day when it has new
          > commits. Not recommended for production use. Each build replaces the previous one
          > under the same \`nightly\` tag.
          >
          > Commit: \`${SHORT_SHA}\` - ${DATE}

          EOF
          # The tag still points at the previous build here, so nightly..HEAD
          # is what changed on main since then.
          if git rev-parse --verify --quiet 'nightly^{commit}' >/dev/null; then
            CHANGES=$(git log --no-merges --format='- %s (%h)' 'nightly..HEAD')
          else
            CHANGES=$(git log --no-merges --format='- %s (%h)' -n 30 HEAD)
          fi
          if [ -n "$CHANGES" ]; then
            {
              echo "## Changes since the previous nightly"
              echo ""
              echo "$CHANGES"
            } >> release_body.md
          fi

      - name: Move the nightly tag to this build
        run: |
          set -euo pipefail
          git tag -f nightly HEAD
          git push origin refs/tags/nightly --force

      - name: Remove the old dated nightlies and the previous assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Earlier nightlies were dated (nightly-YYYYMMDD): delete their
          # releases and tags, so only the rolling `nightly` remains.
          OLD_TAGS=$(git tag --list 'nightly-*')
          while IFS= read -r OLD_TAG; do
            [ -n "$OLD_TAG" ] || continue
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            else
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${OLD_TAG}"
            fi
          done <<<"$OLD_TAGS"

          # The rolling release keeps its tag; clear its assets so the upload
          # below never leaves an older build attached.
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ]; then
            echo "No existing nightly release; nothing to clear."
            exit 0
          fi
          ASSET_IDS=$(jq -r '.assets[].id' <<<"$RELEASE_JSON")
          while IFS= read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done <<<"$ASSET_IDS"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ReqFlux Nightly
          body_path: release_body.md
          prerelease: true
          files: |
            artifacts/reqflux-linux-amd64.tar.gz
            artifacts/reqflux-linux-amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
