name: Nightly

# Rolling nightly build of the Linux `reqflux` package and the macOS disk
# images (amd64 and arm64), like DBFlux's: one
# prerelease under the single tag `nightly`, replaced by every new build. It
# runs once a day and skips when main has not advanced since the commit the
# `nightly` tag points at, so the tag count never grows and an idle main
# publishes nothing. A manual dispatch always builds.

on:
  schedule:
    # 03:17 UTC daily: a low-traffic window, off the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard - canonical repo and new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to build
        id: guard
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Only the canonical repository runs the schedule; forks do not.
          if [ "$REPOSITORY" != "0xErwin1/reqflux" ]; then
            echo "Skipping nightly: not the canonical repository."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The single tag tracks main: a run from any other ref never moves it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The nightly only builds main, not $REF."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # A manual run always builds, even with no new commits.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: building regardless of new commits."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The `nightly` tag points at a pin commit (nix/nightly-info.nix with
          # the real hash) whose first parent is the main commit the last
          # nightly was built from. Skip when main has not advanced since then.
          CURRENT="$(git rev-parse HEAD)"
          if ! LAST="$(git rev-parse --verify --quiet 'nightly^')"; then
            echo "No previous nightly tag: building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LAST" = "$CURRENT" ]; then
            echo "No new commits on main since the last nightly ($LAST): skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prose and designs do not reach the binary, so a range made only of
          # them would publish the same build again. The tag stays put, so the
          # next nightly's changes still cover those commits. A failed diff
          # builds: a broken check costs a build rather than a missed nightly.
          if ! changed="$(git diff --name-only "$LAST" "$CURRENT")"; then
            echo "::warning::cannot diff $LAST..$CURRENT; building"
          elif ! printf '%s\n' "$changed" | grep -qvE '(\.md$|^design/)'; then
            echo "main advanced $LAST -> $CURRENT with prose and design changes only: skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "main advanced $LAST -> $CURRENT: building."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  compute-version:
    name: Compute nightly version
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.nightly.outputs.version }}
      short_sha: ${{ steps.nightly.outputs.short_sha }}
      date: ${{ steps.nightly.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute version string
        id: nightly
        run: |
          # The nightly version is the workspace version with its pre-release
          # suffix stripped (0.1.0-dev.0 -> 0.1.0) plus the short commit as
          # semver build metadata, which does not affect semver ordering.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 workspace version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          BASE=$(grep '^version = "' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/' | sed 's/-[^+]*//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE}-nightly+${SHORT_SHA}"
          {
            echo "version=${NIGHTLY_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "date=$(date -u '+%Y-%m-%d')"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${NIGHTLY_VERSION}"

  build:
    name: Build Linux
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfreetype-dev \
            libfontconfig-dev libssl-dev libzstd-dev libasound2-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The scheduled run is on main; a cache saved on a tag ref can never
          # be read back (same rationale as DBFlux's build).
          save-if: github.ref == 'refs/heads/main'

      - name: Stamp workspace version
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # Same single-line guard as compute-version. VERSION is read from
          # env, not interpolated into the script, so crafted input cannot
          # inject shell. No --locked on the build below: the stamp mutates
          # Cargo.toml, so cargo must refresh the workspace entry in
          # Cargo.lock; dependency-lock integrity is enforced by CI (--locked)
          # on the same commit, where only the local workspace version differs.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 workspace version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          sed -i "s|^version = \".*\"|version = \"${VERSION}\"|" Cargo.toml
          grep -qF "version = \"${VERSION}\"" Cargo.toml \
            || { echo "::error::Version stamp did not apply."; exit 1; }

      - name: Build ReqFlux
        run: cargo build --release -p reqflux

      - name: Assemble the package
        run: |
          mkdir -p pkg/bin pkg/share/applications
          mkdir -p pkg/share/icons/hicolor/scalable/apps
          mkdir -p pkg/share/icons/hicolor/256x256/apps
          cp target/release/reqflux pkg/bin/reqflux
          cp assets/icon/reqflux.desktop pkg/share/applications/reqflux.desktop
          cp assets/icon/reqflux.svg pkg/share/icons/hicolor/scalable/apps/reqflux.svg
          cp assets/icon/reqflux-256.png pkg/share/icons/hicolor/256x256/apps/reqflux.png
          cp LICENSE-APACHE pkg/LICENSE-APACHE

      - name: Create tar archive
        run: |
          cd pkg
          tar -czf ../reqflux-linux-amd64.tar.gz .

      - name: Generate checksum
        run: sha256sum reqflux-linux-amd64.tar.gz > reqflux-linux-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            reqflux-linux-amd64.tar.gz
            reqflux-linux-amd64.tar.gz.sha256
          retention-days: 90

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: compute-version
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # Same matrix as DBFlux's: the x86_64 target is cross-built on the
          # Apple Silicon runner. GitHub's Intel macOS runner is much slower,
          # and arm64 -> x86_64 is a same-OS cross (universal SDK, shared
          # linker).
          - arch: amd64
            runs_on: macos-15
            target: x86_64-apple-darwin
          - arch: arm64
            runs_on: macos-15
            target: aarch64-apple-darwin

    env:
      APP_NAME: ReqFlux Nightly
      BUNDLE_ID: dev.iperez.reqflux.nightly

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Add cross target to the pinned toolchain
        # rust-toolchain.toml pins the toolchain cargo actually uses; add the
        # target to it so the x86_64-apple-darwin std exists when
        # cross-compiling on the Apple Silicon runner. No-op for arm64.
        run: rustup target add ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: github.ref == 'refs/heads/main'

      - name: Stamp workspace version
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          # See the Linux build job for the rationale (single-line guard and
          # env-routed version). BSD sed needs the -i.bak form.
          MATCHES=$(grep -c '^version = "' Cargo.toml)
          if [ "$MATCHES" -ne 1 ]; then
            echo "::error::Expected exactly 1 workspace version line in Cargo.toml, found $MATCHES."
            exit 1
          fi
          sed -i.bak "s|^version = \".*\"|version = \"${VERSION}\"|" Cargo.toml
          grep -qF "version = \"${VERSION}\"" Cargo.toml \
            || { echo "::error::Version stamp did not apply."; exit 1; }

      - name: Build ReqFlux
        # No --locked: the version stamp above mutates Cargo.toml; see the
        # Linux job.
        #
        # Link-time optimization is off on macOS, as in DBFlux: with
        # `lto = "thin"` the final crate is a single rustc process that needs
        # more memory than the 7 GB runner has, and the job swaps until it
        # times out (the amd64 cross build fails first, as a SIGBUS, because it
        # also holds the host artifacts). The binaries trade some size and
        # speed for a build that fits. Linux keeps the profile from Cargo.toml.
        #
        # A sampler records swap usage and the largest processes every 30
        # seconds, and `--timings` records how long each crate took, so a slow
        # or failing build can be traced to a crate and to memory pressure.
        # The samples are written outside the build step so they survive a
        # timeout.
        run: |
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16

          SAMPLES="$RUNNER_TEMP/memory-samples.log"
          (
            while true; do
              {
                echo "== $(date -u '+%H:%M:%S') swap: $(sysctl -n vm.swapusage)"
                ps -Ao rss=,command= | sort -nr | head -3 | awk '{ printf "  %6d MB %s\n", $1 / 1024, substr($0, index($0, $2), 160) }'
              } >> "$SAMPLES"
              sleep 30
            done
          ) &
          SAMPLER_PID=$!

          cargo build --release -p reqflux --target ${{ matrix.target }} --timings

          kill "$SAMPLER_PID"

      - name: Report build memory samples
        if: always()
        run: |
          SAMPLES="$RUNNER_TEMP/memory-samples.log"
          if [ ! -f "$SAMPLES" ]; then
            echo "No memory samples were recorded."
            exit 0
          fi

          echo "Final swap usage: $(sysctl -n vm.swapusage)"
          cat "$SAMPLES"
          mkdir -p target/cargo-timings
          cp "$SAMPLES" target/cargo-timings/

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-macos-${{ matrix.arch }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

      - name: Create app bundle
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          APP_BUNDLE="$APP_NAME.app"

          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp target/${{ matrix.target }}/release/reqflux "$APP_BUNDLE/Contents/MacOS/"
          chmod +x "$APP_BUNDLE/Contents/MacOS/reqflux"

          # Info.plist names the icon AppIcon; without it the Dock and Finder
          # show the generic application icon. packaging/icons/reqflux.icns is
          # rasterized from assets/icon/reqflux.svg.
          cp packaging/icons/reqflux.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"

          sed -e "s/\${VERSION}/$VERSION/g" -e "s/\${APP_NAME}/$APP_NAME/g" -e "s/\${BUNDLE_ID}/$BUNDLE_ID/g" \
            resources/macos/Info.plist > "$APP_BUNDLE/Contents/Info.plist"

      # macOS ties a keychain grant to the signature of the application that
      # asked for it, and ReqFlux keeps workspace secrets in the keychain.
      # Ad-hoc signatures differ per build, so without a stable identity every
      # update makes the user re-authorise those secrets. A self-signed
      # certificate is enough for that; it does not satisfy Gatekeeper, which
      # needs a Developer ID and notarisation.
      - name: Sign app bundle
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          APP_BUNDLE="$APP_NAME.app"

          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 is not set; signing ad-hoc. Keychain grants will not survive the next update."
            codesign --force --deep --sign - "$APP_BUNDLE"
            codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"
          CERT="$RUNNER_TEMP/signing.pem"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$P12"
          openssl pkcs12 -in "$P12" -nokeys -clcerts -passin env:MACOS_CERTIFICATE_PASSWORD -out "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep the user's existing keychains in the search list after ours.
          EXISTING_KEYCHAINS=()
          while IFS= read -r LINE; do
            LINE="$(printf '%s' "$LINE" | tr -d '" ')"
            [ -n "$LINE" ] && EXISTING_KEYCHAINS+=("$LINE")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"

          # A self-signed certificate is not trusted by default, and codesign
          # refuses an untrusted identity. Trusting it for code signing only,
          # in the runner's system keychain, makes it usable for this job.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERT"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' 'NR==1 {print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No code-signing identity found in the imported certificate."
            exit 1
          fi
          echo "Signing as: $IDENTITY"

          codesign --force --deep --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          rm -f "$P12" "$CERT"

      - name: Remove signing keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          [ -f "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_BUNDLE="$APP_NAME.app"

          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "$APP_BUNDLE" 200 190 \
            --hide-extension "$APP_BUNDLE" \
            --app-drop-link 600 185 \
            --no-internet-enable \
            --skip-jenkins \
            reqflux-macos-${{ matrix.arch }}.dmg \
            "$APP_BUNDLE"

      - name: Generate checksum
        run: shasum -a 256 reqflux-macos-${{ matrix.arch }}.dmg > reqflux-macos-${{ matrix.arch }}.dmg.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            reqflux-macos-${{ matrix.arch }}.dmg
            reqflux-macos-${{ matrix.arch }}.dmg.sha256
          retention-days: 90

  release:
    name: Publish rolling nightly release
    # As in DBFlux, every platform must build before the release publishes:
    # a failed macOS build leaves the tag and the previous assets in place.
    needs: [compute-version, build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The previous `nightly` tag scopes the list of changes.
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true

      - name: Compose nightly release body
        env:
          SHORT_SHA: ${{ needs.compute-version.outputs.short_sha }}
          DATE: ${{ needs.compute-version.outputs.date }}
        run: |
          cat > release_body.md <<EOF
          > **Nightly build**: built automatically from \`main\` once a day when it has new
          > commits. Not recommended for production use. Each build replaces the previous one
          > under the same \`nightly\` tag.
          >
          > Commit: \`${SHORT_SHA}\` - ${DATE}

          The macOS disk images are not notarised: on first launch, open ReqFlux Nightly from
          Finder with right-click > Open, or clear the quarantine flag with
          \`xattr -dr com.apple.quarantine "/Applications/ReqFlux Nightly.app"\`.

          EOF
          # The tag still points at the previous pin commit here, and its
          # first parent is the main commit that build came from, so
          # nightly^..HEAD is what changed on main since then.
          if git rev-parse --verify --quiet 'nightly^' >/dev/null; then
            CHANGES=$(git log --no-merges --format='- %s (%h)' 'nightly^..HEAD')
          else
            CHANGES=$(git log --no-merges --format='- %s (%h)' -n 30 HEAD)
          fi
          if [ -n "$CHANGES" ]; then
            {
              echo "## Changes since the previous nightly"
              echo ""
              echo "$CHANGES"
            } >> release_body.md
          fi

      - name: Remove the old dated nightlies and the previous assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Earlier nightlies were dated (nightly-YYYYMMDD): delete their
          # releases and tags, so only the rolling `nightly` remains.
          OLD_TAGS=$(git tag --list 'nightly-*')
          while IFS= read -r OLD_TAG; do
            [ -n "$OLD_TAG" ] || continue
            if gh release view "$OLD_TAG" >/dev/null 2>&1; then
              gh release delete "$OLD_TAG" --yes --cleanup-tag
            else
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${OLD_TAG}"
            fi
          done <<<"$OLD_TAGS"

          # The rolling release keeps its tag; clear its assets so the upload
          # below never leaves an older build attached.
          # Only a 404 means there is no release yet; any other API failure
          # fails the step instead of silently skipping the clear.
          if ! RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>api_error.txt); then
            if grep -q 'HTTP 404' api_error.txt; then
              echo "No existing nightly release; nothing to clear."
              exit 0
            fi
            cat api_error.txt >&2
            exit 1
          fi
          ASSET_IDS=$(jq -r '.assets[].id' <<<"$RELEASE_JSON")
          while IFS= read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done <<<"$ASSET_IDS"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ReqFlux Nightly
          body_path: release_body.md
          prerelease: true
          files: |
            artifacts/reqflux-linux-amd64.tar.gz
            artifacts/reqflux-linux-amd64.tar.gz.sha256
            artifacts/reqflux-macos-amd64.dmg
            artifacts/reqflux-macos-amd64.dmg.sha256
            artifacts/reqflux-macos-arm64.dmg
            artifacts/reqflux-macos-arm64.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, so the tag only moves once the build is published: if anything
      # above fails, the tag still points at the previous nightly, the guard
      # sees new commits and the next scheduled run retries.
      #
      # The tag points at a pin commit on top of this build's main commit
      # that rewrites nix/nightly-info.nix with the published tarball's hash,
      # so `github:0xErwin1/reqflux/nightly#reqflux-nightly` fetches it. The
      # pin commit is never pushed to main; pushing the tag carries it.
      - name: Pin nix/nightly-info.nix and move the nightly tag
        env:
          NIGHTLY_VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)

          # SRI hash of the published tarball, without requiring nix.
          HASH_AMD64="sha256-$(openssl dgst -sha256 -binary \
            artifacts/reqflux-linux-amd64.tar.gz | base64 -w0)"

          cat > nix/nightly-info.nix <<NIX_EOF
          # Rolling nightly channel pointer, auto-generated by .github/workflows/nightly.yml.
          #
          # This file lives on the \`nightly\` git ref. The hash and version below
          # match the artifact published in the current rolling nightly release.
          # On \`main\` it only holds a placeholder: always consume via the
          # \`nightly\` ref:
          #
          #   nix run github:0xErwin1/reqflux/nightly#reqflux-nightly
          #
          # From-source nightly (no hash needed):
          #
          #   nix run github:0xErwin1/reqflux/nightly#reqflux-source
          {
            version = "${NIGHTLY_VERSION}";

            artifacts = {
              "x86_64-linux" = {
                url = "https://github.com/0xErwin1/reqflux/releases/download/nightly/reqflux-linux-amd64.tar.gz";
                hash = "${HASH_AMD64}";
              };
            };
          }
          NIX_EOF

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add nix/nightly-info.nix
          git commit -m "chore(nightly): pin nix/nightly-info.nix ${SHORT_SHA}"

          git tag -f nightly HEAD
          git push origin refs/tags/nightly --force
